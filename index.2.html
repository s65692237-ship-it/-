<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        /* Тёмная тема (по умолчанию) */
        body { margin: 0; background: #0e1621; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; transition: all 0.3s; }
        #header { background: #17212b; padding: 15px; text-align: center; font-size: 20px; border-bottom: 1px solid #242f3d; transition: all 0.3s; }
        #onlineList { padding: 5px 15px; font-size: 14px; color: #7d8b99; background: #17212b; border-bottom: 1px solid #242f3d; transition: all 0.3s; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 15px; margin: 5px 0; word-wrap: break-word; display: flex; align-items: flex-start; position: relative; }
        .my { background: #2b5278; align-self: flex-end; flex-direction: row-reverse; }
        .other { background: #182533; align-self: flex-start; }
        .avatar { font-size: 24px; margin: 0 8px; }
        .bubble { display: flex; flex-direction: column; }
        .name { font-size: 12px; color: #7d8b99; margin-bottom: 3px; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: #f00; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }
        .my .delete-btn { display: block; }
        #inputArea { display: flex; padding: 10px; background: #17212b; border-top: 1px solid #242f3d; align-items: center; transition: all 0.3s; }
        #nameInput { width: 70px; padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; margin-right: 5px; transition: all 0.3s; }
        #avatarBtn { font-size: 24px; background: #242f3d; border: none; border-radius: 10px; padding: 5px 10px; cursor: pointer; margin-right: 5px; }
        #emojiBtn { font-size: 24px; background: #242f3d; border: none; border-radius: 10px; padding: 5px 10px; cursor: pointer; margin-right: 5px; }
        #msgInput { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; margin-right: 5px; transition: all 0.3s; }
        #sendBtn { padding: 10px 20px; border: none; border-radius: 10px; background: #2b5278; color: #fff; cursor: pointer; }
        #roomArea { padding: 10px; background: #17212b; text-align: center; transition: all 0.3s; }
        #roomInput { padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; transition: all 0.3s; }
        #joinBtn { padding: 10px 20px; border: none; border-radius: 10px; background: #2b5278; color: #fff; cursor: pointer; }
        #avatarPanel { position: fixed; bottom: 70px; left: 10px; background: #17212b; padding: 10px; border-radius: 10px; display: none; z-index: 100; border: 1px solid #242f3d; }
        #avatarPanel span { font-size: 30px; cursor: pointer; margin: 5px; display: inline-block; }
        #emojiPanel { position: fixed; bottom: 70px; right: 10px; background: #17212b; padding: 10px; border-radius: 10px; display: none; z-index: 100; border: 1px solid #242f3d; width: 250px; }
        #emojiPanel span { font-size: 24px; cursor: pointer; margin: 3px; display: inline-block; }
        #themeBtn { position: fixed; top: 10px; right: 10px; background: #2b5278; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; z-index: 1000; }
        
        /* Светлая тема */
        body.light { background: #e4e6eb; color: #000; }
        body.light #header { background: #fff; border-bottom: 1px solid #ddd; }
        body.light #onlineList { background: #fff; color: #666; border-bottom: 1px solid #ddd; }
        body.light .my { background: #0084ff; color: #fff; }
        body.light .other { background: #fff; color: #000; }
        body.light #inputArea { background: #fff; border-top: 1px solid #ddd; }
        body.light #nameInput, body.light #msgInput, body.light #roomInput { background: #f0f0f0; color: #000; }
        body.light #roomArea { background: #fff; }
        body.light #avatarPanel, body.light #emojiPanel { background: #fff; border: 1px solid #ddd; }
        body.light .name { color: #666; }

        @media (max-width: 600px) {
            #nameInput { width: 50px; font-size: 12px; }
            #avatarBtn, #emojiBtn { font-size: 18px; padding: 3px 6px; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    <div id="header">Мой Мессенджер</div>
    <div id="roomArea">
        <input id="roomInput" placeholder="Комната" value="общий">
        <button id="joinBtn" onclick="joinRoom()">Войти</button>
    </div>
    <div id="onlineList">Онлайн: никого</div>
    <div id="chat"></div>
    
    <div id="avatarPanel">
        <span onclick="setAvatar('🐱')">🐱</span>
        <span onclick="setAvatar('👹')">👹</span>
        <span onclick="setAvatar('😎')">😎</span>
        <span onclick="setAvatar('🩷')">🩷</span>
        <span onclick="setAvatar('💀')">💀</span>
        <span onclick="setAvatar('🤖')">🤖</span>
        <span onclick="setAvatar('🐶')">🐶</span>
    </div>
    
    <div id="emojiPanel">
        <span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('😭')">😭</span>
        <span onclick="addEmoji('💀')">💀</span>
        <span onclick="addEmoji('🔥')">🔥</span>
        <span onclick="addEmoji('😈')">😈</span>
        <span onclick="addEmoji('🤡')">🤡</span>
        <span onclick="addEmoji('👽')">👽</span>
        <span onclick="addEmoji('🐱')">🐱</span>
        <span onclick="addEmoji('🩷')">🩷</span>
        <span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('👎')">👎</span>
        <span onclick="addEmoji('💩')">💩</span>
        <span onclick="addEmoji('🎉')">🎉</span>
        <span onclick="addEmoji('🚀')">🚀</span>
        <span onclick="addEmoji('⚡')">⚡</span>
        <span onclick="addEmoji('🍕')">🍕</span>
    </div>
    
    <div id="inputArea">
        <input id="nameInput" placeholder="Имя" value="Гость">
        <button id="avatarBtn" onclick="toggleAvatarPanel()">🐱</button>
        <button id="emojiBtn" onclick="toggleEmojiPanel()">😀</button>
        <input id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">→</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSNsgJB3pFsmkSGLXCCa0R22nAkmr8gM",
            authDomain: "my-messenger-c9a1e.firebaseapp.com",
            databaseURL: "https://my-messenger-c9a1e-default-rtdb.firebaseio.com",
            projectId: "my-messenger-c9a1e",
        };

        let currentRoom = "общий";
        let userName = "Гость";
        let userAvatar = "🐱";
        let db = null;
        let currentRef = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase ошибка: " + e.message);
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            document.getElementById('themeBtn').innerText = document.body.classList.contains('light') ? '☀️' : '🌙';
        }

        function toggleAvatarPanel() {
            const panel = document.getElementById('avatarPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function toggleEmojiPanel() {
            const panel = document.getElementById('emojiPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function setAvatar(emoji) {
            userAvatar = emoji;
            document.getElementById('avatarBtn').innerText = emoji;
            document.getElementById('avatarPanel').style.display = 'none';
        }

        function addEmoji(emoji) {
            const msgInput = document.getElementById('msgInput');
            msgInput.value += emoji;
            document.getElementById('emojiPanel').style.display = 'none';
        }

        function joinRoom() {
            if (!db) { alert("Firebase не загрузился."); return; }
            if (currentRef) currentRef.off();
            currentRoom = document.getElementById('roomInput').value || "общий";
            userName = document.getElementById('nameInput').value.trim() || "Гость";
            document.getElementById('chat').innerHTML = '';
            currentRef = db.ref('rooms/' + currentRoom);
            
            currentRef.child('users/' + userName).set(true);
            currentRef.child('users/' + userName).onDisconnect().remove();

            currentRef.child('users').on('value', (snap) => {
                const users = [];
                snap.forEach((child) => users.push(child.key));
                document.getElementById('onlineList').innerText = 'Онлайн: ' + (users.length ? users.join(', ') : 'никого');
            });

            // История сообщений
            currentRef.once('value', (snap) => {
                document.getElementById('chat').innerHTML = '';
                snap.forEach((child) => {
                    if (child.key !== 'users') {
                        const msg = child.val();
                        addMessageToChat(msg, child.key);
                    }
                });
            });

            loadMessages();
        }

        function sendMessage() {
            if (!db || !currentRef) { alert("Сначала войди в комнату."); return; }
            const msgInput = document.getElementById('msgInput');
            const nameInput = document.getElementById('nameInput');
            const text = msgInput.value.trim();
            userName = nameInput.value.trim() || "Гость";
            if (!text) return;

            currentRef.child('users/' + userName).set(true);

            currentRef.push({
                name: userName,
                avatar: userAvatar,
                text: text,
                time: Date.now()
            });
            msgInput.value = '';
        }

        function deleteMessage(key) {
            if (!db || !currentRef) return;
            if (confirm("Удалить сообщение?")) {
                currentRef.child(key).remove();
            }
        }

        function loadMessages() {
            currentRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const key = snapshot.key;
                if (key === 'users') return;
                
                if (msg.name !== userName) {
                    new Audio('https://www.soundjay.com/buttons/beep-07.wav').play();
                    showNotification(msg.name + ': ' + msg.text);
                }
                addMessageToChat(msg, key);
            });

            currentRef.on('child_removed', (snapshot) => {
                if (snapshot.key === 'users') return;
                document.getElementById('chat').innerHTML = '';
                currentRef.once('value', (snap) => {
                    snap.forEach((child) => {
                        if (child.key !== 'users') {
                            const msg = child.val();
                            addMessageToChat(msg, child.key);
                        }
                    });
                });
            });
        }

        function addMessageToChat(msg, key) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.name === userName ? 'my' : 'other');
            
            const avatarSpan = document.createElement('span');
            avatarSpan.className = 'avatar';
            avatarSpan.innerText = msg.avatar || '🐱';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="name">' + msg.name + '</div>' + msg.text;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '✖';
            delBtn.onclick = () => deleteMessage(key);
            
            div.appendChild(avatarSpan);
            div.appendChild(bubble);
            div.appendChild(delBtn);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showNotification(text) {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#2b5278;padding:10px 20px;border-radius:10px;z-index:9999;color:#fff;font-family:Arial;';
            div.innerText = text;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        window.onload = function() {
            if (db) joinRoom();
        };
    </script>
</body>
</html>
