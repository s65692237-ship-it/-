<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        body { margin: 0; background: #0e1621; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #17212b; padding: 15px; text-align: center; font-size: 20px; border-bottom: 1px solid #242f3d; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 15px; margin: 5px 0; word-wrap: break-word; }
        .my { background: #2b5278; align-self: flex-end; }
        .other { background: #182533; align-self: flex-start; }
        .name { font-size: 12px; color: #7d8b99; margin-bottom: 3px; }
        #inputArea { display: flex; padding: 10px; background: #17212b; border-top: 1px solid #242f3d; }
        #nameInput { width: 100px; padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; margin-right: 5px; }
        #msgInput { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; margin-right: 5px; }
        #sendBtn { padding: 10px 20px; border: none; border-radius: 10px; background: #2b5278; color: #fff; cursor: pointer; }
        #roomArea { padding: 10px; background: #17212b; text-align: center; }
        #roomInput { padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; }
        #joinBtn { padding: 10px 20px; border: none; border-radius: 10px; background: #2b5278; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">Мой Мессенджер</div>
    <div id="roomArea">
        <input id="roomInput" placeholder="Комната" value="общий">
        <button id="joinBtn" onclick="joinRoom()">Войти</button>
    </div>
    <div id="chat"></div>
    <div id="inputArea">
        <input id="nameInput" placeholder="Имя" value="Гость">
        <input id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">→</button>
    </div>

    <!-- Firebase через другой CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // Твой конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyCSNsgJB3pFsmkSGLXCCa0R22nAkmr8gM",
            authDomain: "my-messenger-c9a1e.firebaseapp.com",
            databaseURL: "https://my-messenger-c9a1e-default-rtdb.firebaseio.com",
            projectId: "my-messenger-c9a1e",
        };

        let currentRoom = "общий";
        let userName = "Гость";
        let db = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase ошибка: " + e.message);
        }

        function joinRoom() {
            if (!db) { alert("Firebase не загрузился. Проверь интернет."); return; }
            currentRoom = document.getElementById('roomInput').value || "общий";
            document.getElementById('chat').innerHTML = '';
            loadMessages();
        }

        function sendMessage() {
            if (!db) { alert("Firebase не загрузился."); return; }
            const msgInput = document.getElementById('msgInput');
            const nameInput = document.getElementById('nameInput');
            const text = msgInput.value.trim();
            userName = nameInput.value.trim() || "Гость";
            if (!text) return;

            db.ref('rooms/' + currentRoom).push({
                name: userName,
                text: text,
                time: Date.now()
            });
            msgInput.value = '';
        }

        function loadMessages() {
            if (!db) return;
            db.ref('rooms/' + currentRoom).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const chat = document.getElementById('chat');
                const div = document.createElement('div');
                div.className = 'message ' + (msg.name === userName ? 'my' : 'other');
                div.innerHTML = '<div class="name">' + msg.name + '</div>' + msg.text;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            });
        }

        // Автозапуск
        window.onload = function() {
            if (db) joinRoom();
        };
    </script>
</body>
</html>
