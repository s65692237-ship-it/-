<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOX</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0e1621; color: #fff; font-family: Arial; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 300px; background: #17212b; border-right: 1px solid #242f3d; display: flex; flex-direction: column; }
        #logo { padding: 15px; font-size: 24px; font-weight: bold; color: #2b5278; border-bottom: 1px solid #242f3d; text-align: center; }
        #userInfo { padding: 10px; border-bottom: 1px solid #242f3d; display: flex; align-items: center; flex-wrap: wrap; }
        #userInfo input { width: 80px; padding: 6px; border: none; border-radius: 8px; background: #242f3d; color: #fff; margin-right: 3px; margin-bottom: 3px; }
        #userInfo button { font-size: 16px; background: #242f3d; border: none; border-radius: 8px; padding: 4px 6px; cursor: pointer; margin-right: 3px; margin-bottom: 3px; }
        #addFriend { width: 100%; padding: 6px; border: none; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; margin-top: 5px; }
        #coins { padding: 5px 10px; font-size: 14px; color: #ffd700; text-align: center; }
        #myID { padding: 5px 10px; font-size: 12px; color: #7d8b99; text-align: center; }
        #chats { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #242f3d; cursor: pointer; display: flex; align-items: center; }
        .chat-item:hover { background: #202b36; }
        .chat-item.active { background: #2b5278; }
        .chat-item .avatar { font-size: 24px; margin-right: 10px; }
        .chat-item .name { font-size: 16px; }
        
        #main { flex: 1; display: flex; flex-direction: column; }
        #chatHeader { padding: 15px; background: #17212b; border-bottom: 1px solid #242f3d; font-size: 18px; display: flex; align-items: center; }
        #backBtn { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 10px; }
        #onlineList { padding: 5px 15px; font-size: 12px; color: #7d8b99; background: #17212b; border-bottom: 1px solid #242f3d; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 15px; margin: 5px 0; word-wrap: break-word; display: flex; align-items: flex-start; position: relative; cursor: pointer; }
        .my { background: #2b5278; align-self: flex-end; flex-direction: row-reverse; }
        .other { background: #182533; align-self: flex-start; }
        .msg-avatar { font-size: 24px; margin: 0 8px; }
        .bubble { display: flex; flex-direction: column; }
        .name { font-size: 12px; color: #7d8b99; margin-bottom: 3px; }
        .rank { font-size: 10px; color: #ffd700; margin-left: 5px; }
        .id { font-size: 10px; color: #666; margin-left: 5px; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: #f00; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }
        .my .delete-btn { display: block; }
        .reaction { position: absolute; bottom: -10px; right: 10px; background: #17212b; border-radius: 10px; padding: 2px 5px; font-size: 14px; }
        
        #inputArea { display: flex; padding: 10px; background: #17212b; border-top: 1px solid #242f3d; align-items: center; }
        #msgInput { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #242f3d; color: #fff; margin-right: 5px; }
        #emojiBtn { font-size: 24px; background: #242f3d; border: none; border-radius: 10px; padding: 5px 10px; cursor: pointer; margin-right: 5px; }
        #giftBtn { font-size: 24px; background: #242f3d; border: none; border-radius: 10px; padding: 5px 10px; cursor: pointer; margin-right: 5px; }
        #sendBtn { padding: 10px 20px; border: none; border-radius: 10px; background: #2b5278; color: #fff; cursor: pointer; }
        
        #avatarPanel { position: fixed; bottom: 70px; left: 10px; background: #17212b; padding: 10px; border-radius: 10px; display: none; z-index: 100; border: 1px solid #242f3d; }
        #avatarPanel span { font-size: 30px; cursor: pointer; margin: 5px; display: inline-block; }
        #emojiPanel { position: fixed; bottom: 70px; right: 10px; background: #17212b; padding: 10px; border-radius: 10px; display: none; z-index: 100; border: 1px solid #242f3d; width: 280px; max-height: 200px; overflow-y: auto; }
        #emojiPanel span { font-size: 24px; cursor: pointer; margin: 3px; display: inline-block; }
        #premiumPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #17212b; padding: 20px; border-radius: 15px; display: none; z-index: 200; border: 2px solid #ffd700; text-align: center; width: 90%; max-width: 350px; }
        #premiumPanel button { display: block; width: 100%; margin: 5px 0; padding: 10px; border: none; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; }
        #giftPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #17212b; padding: 20px; border-radius: 15px; display: none; z-index: 200; border: 2px solid #ffd700; text-align: center; width: 90%; max-width: 350px; }
        #giftPanel button { display: block; width: 100%; margin: 5px 0; padding: 10px; border: none; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; }
        #adminPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #17212b; padding: 20px; border-radius: 15px; display: none; z-index: 300; border: 2px solid #f00; text-align: center; width: 90%; max-width: 350px; }
        #adminPanel button { display: block; width: 100%; margin: 5px 0; padding: 10px; border: none; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; }
        #adminPanel input { width: 100%; padding: 8px; margin: 5px 0; border: none; border-radius: 8px; background: #242f3d; color: #fff; }
        
        #actionPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #17212b; padding: 15px; border-radius: 15px; display: none; z-index: 400; border: 2px solid #f00; text-align: center; width: 90%; max-width: 300px; }
        #actionPanel button { display: block; width: 100%; margin: 5px 0; padding: 10px; border: none; border-radius: 8px; background: #2b5278; color: #fff; cursor: pointer; }
        
        #reactionPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #17212b; padding: 15px; border-radius: 15px; display: none; z-index: 400; border: 2px solid #2b5278; text-align: center; }
        #reactionPanel span { font-size: 30px; cursor: pointer; margin: 5px; display: inline-block; }
        
        @media (max-width: 700px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 100%; }
            #main { display: none; height: 100%; }
            body.show-chat #sidebar { display: none; }
            body.show-chat #main { display: flex; }
            
            #backBtn { display: block; }
            #logo { padding: 10px; font-size: 20px; }
            #userInfo { padding: 8px; }
            #userInfo input { width: 60px; font-size: 14px; }
            #userInfo button { font-size: 14px; padding: 3px 5px; }
            #addFriend { font-size: 14px; padding: 8px; }
            #coins { font-size: 13px; }
            .chat-item { padding: 12px; }
            .chat-item .name { font-size: 15px; }
            
            #chatHeader { padding: 10px; font-size: 16px; }
            #onlineList { font-size: 11px; }
            #chat { padding: 10px; }
            .message { max-width: 85%; padding: 8px 12px; }
            .msg-avatar { font-size: 20px; }
            .name { font-size: 11px; }
            
            #inputArea {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 8px;
                background: #17212b;
                border-top: 1px solid #242f3d;
                z-index: 999;
            }
            #msgInput { padding: 8px; font-size: 14px; }
            #emojiBtn, #giftBtn { font-size: 20px; padding: 4px 8px; }
            #sendBtn { padding: 8px 15px; font-size: 14px; }
            
            #chat { padding-bottom: 70px; }
            
            #avatarPanel { bottom: 60px; left: 5px; padding: 8px; }
            #avatarPanel span { font-size: 26px; }
            #emojiPanel { bottom: 60px; right: 5px; padding: 8px; width: 220px; }
            #emojiPanel span { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="logo">VOX</div>
        <div id="userInfo">
            <input id="nameInput" placeholder="Имя" value="Гость">
            <button onclick="toggleAvatarPanel()" id="avatarBtn">🐱</button>
            <button onclick="togglePremiumPanel()">💎</button>
            <button id="addFriend" onclick="addFriend()">+ Добавить друга</button>
            <button onclick="buyCoins()" style="background: #ffd700; color: #000;">💰 Купить коины</button>
            <button onclick="toggleAdminPanel()" id="adminBtn" style="background: #f00; display: none;">⚙️ Админ</button>
        </div>
        <div id="coins">Коины: <span id="coinCount">0</span></div>
        <div id="myID">Мой ID: <span id="myIDValue">...</span></div>
        <div id="chats"></div>
    </div>
    
    <div id="main">
        <div id="chatHeader">
            <button id="backBtn" onclick="backToChats()">←</button>
            <span id="chatTitle">Общий чат</span>
        </div>
        <div id="onlineList">Онлайн: никого</div>
        <div id="chat"></div>
        <div id="inputArea">
            <button id="emojiBtn" onclick="toggleEmojiPanel()">😀</button>
            <button id="giftBtn" onclick="toggleGiftPanel()">🎁</button>
            <input id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">→</button>
        </div>
    </div>
    
    <div id="avatarPanel">
        <span onclick="setAvatar('🐱')">🐱</span>
        <span onclick="setAvatar('👹')">👹</span>
        <span onclick="setAvatar('😎')">😎</span>
        <span onclick="setAvatar('🩷')">🩷</span>
        <span onclick="setAvatar('💀')">💀</span>
        <span onclick="setAvatar('🤖')">🤖</span>
        <span onclick="setAvatar('🐶')">🐶</span>
    </div>
    
    <div id="emojiPanel">
        <span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('😭')">😭</span>
        <span onclick="addEmoji('💀')">💀</span>
        <span onclick="addEmoji('🔥')">🔥</span>
        <span onclick="addEmoji('😈')">😈</span>
        <span onclick="addEmoji('🤡')">🤡</span>
        <span onclick="addEmoji('👽')">👽</span>
        <span onclick="addEmoji('🐱')">🐱</span>
        <span onclick="addEmoji('🩷')">🩷</span>
        <span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('👎')">👎</span>
        <span onclick="addEmoji('💩')">💩</span>
        <span onclick="addEmoji('🎉')">🎉</span>
        <span onclick="addEmoji('🚀')">🚀</span>
        <span onclick="addEmoji('⚡')">⚡</span>
        <span onclick="addEmoji('🍕')">🍕</span>
        <span onclick="addEmoji('😡')">😡</span>
        <span onclick="addEmoji('🥶')">🥶</span>
        <span onclick="addEmoji('🤯')">🤯</span>
        <span onclick="addEmoji('😱')">😱</span>
        <span onclick="addEmoji('🤑')">🤑</span>
        <span onclick="addEmoji('🤮')">🤮</span>
        <span onclick="addEmoji('🤠')">🤠</span>
        <span onclick="addEmoji('💪')">💪</span>
        <span onclick="addEmoji('👀')">👀</span>
        <span onclick="addEmoji('❤️')">❤️</span>
        <span onclick="addEmoji('🧡')">🧡</span>
        <span onclick="addEmoji('💛')">💛</span>
        <span onclick="addEmoji('💚')">💚</span>
        <span onclick="addEmoji('💙')">💙</span>
        <span onclick="addEmoji('💜')">💜</span>
        <span onclick="addEmoji('🖤')">🖤</span>
        <span onclick="addEmoji('🤍')">🤍</span>
    </div>
    
    <div id="reactionPanel">
        <p>Выбери реакцию:</p>
        <span onclick="addReaction('😂')">😂</span>
        <span onclick="addReaction('😭')">😭</span>
        <span onclick="addReaction('💀')">💀</span>
        <span onclick="addReaction('🔥')">🔥</span>
        <span onclick="addReaction('😈')">😈</span>
        <span onclick="addReaction('👍')">👍</span>
        <span onclick="addReaction('👎')">👎</span>
        <span onclick="addReaction('❤️')">❤️</span>
        <span onclick="addReaction('🩷')">🩷</span>
        <span onclick="addReaction('💩')">💩</span>
        <span onclick="addReaction('🎉')">🎉</span>
        <span onclick="addReaction('🚀')">🚀</span>
        <button onclick="closeReactionPanel()" style="margin-top:10px; padding:8px; border:none; border-radius:8px; background:#2b5278; color:#fff; cursor:pointer;">Отмена</button>
    </div>
    
    <div id="actionPanel">
        <p>Действия над <span id="actionTargetName"></span> (ID: <span id="actionTargetID"></span>):</p>
        <button onclick="actionBan()" style="background: #f00;">🚫 Бан</button>
        <button onclick="actionWarn()" style="background: #f80;">⚠️ Предупреждение</button>
        <button onclick="actionMute()" style="background: #ff0; color: #000;">🔇 Мут</button>
        <button onclick="actionGiveAdmin()" style="background: #0f0; color: #000;">👑 Назначить админом</button>
        <button onclick="actionGivePrime()" style="background: #0ff; color: #000;">💎 Дать Prime</button>
        <button onclick="actionGiveCoins()" style="background: #ffd700; color: #000;">💰 Дать коины</button>
        <button onclick="actionGiveGift()" style="background: #f0f; color: #fff;">🎁 Дать подарок</button>
        <button onclick="closeActionPanel()" style="background: #555;">Отмена</button>
    </div>
    
    <div id="premiumPanel">
        <h2>💎 VOX Premium</h2>
        <p>Выбери своё звание:</p>
        <button onclick="buyPrime()" style="background: #ffd700; color: #000; font-weight: bold;">👑 VOX Prime — написать @V0XPRM</button>
        <button onclick="setRank('🩷 VOX')">🩷 VOX (обычный)</button>
        <button onclick="buyPrime()" style="background: #f0f; color: #fff;">😎 VOX Крутой — написать @V0XPRM</button>
        <button onclick="buyPrime()" style="background: #0ff; color: #000;">💎 VOX Донатер — написать @V0XPRM</button>
        <button onclick="buyPrime()" style="background: #ff0; color: #000;">👑 VOX Легенда — написать @V0XPRM</button>
    </div>
    
    <div id="giftPanel">
        <h2>🎁 Подарки</h2>
        <p>Выбери подарок:</p>
        <button onclick="sendGift('🌹', 15)">🌹 Роза — 15 коинов</button>
        <button onclick="sendGift('🎁', 25)">🎁 Подарок — 25 коинов</button>
        <button onclick="sendGift('👑', 50)">👑 Корона — 50 коинов</button>
        <button onclick="sendGift('💎', 100)">💎 Алмаз — 100 коинов</button>
    </div>
    
    <div id="adminPanel">
        <h2>⚙️ Админ-панель</h2>
        <input id="adminTarget" placeholder="ID пользователя (VOX-XXXXXX)">
        <button onclick="adminGiveRank()">Выдать звание</button>
        <button onclick="adminGiveCoins()">Выдать коины</button>
        <button onclick="adminWarn()">Предупреждение</button>
        <button onclick="adminBan()">Забанить</button>
        <button onclick="toggleAdminPanel()">Закрыть</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSNsgJB3pFsmkSGLXCCa0R22nAkmr8gM",
            authDomain: "my-messenger-c9a1e.firebaseapp.com",
            databaseURL: "https://my-messenger-c9a1e-default-rtdb.firebaseio.com",
            projectId: "my-messenger-c9a1e",
        };

        let currentChat = "general";
        let userName = "Гость";
        let userAvatar = "🐱";
        let userRank = "🩷 VOX";
        let userID = "";
        let coins = 0;
        let isPrime = false;
        let isAdmin = false;
        let db = null;
        let currentRef = null;
        let selectedMessageKey = null;
        let selectedUserName = "";
        let selectedUserID = "";

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase ошибка: " + e.message);
        }

        // ===== ГЕНЕРАЦИЯ ID С СОХРАНЕНИЕМ =====
        function getSavedID() {
            let id = localStorage.getItem('vox_id');
            if (!id) {
                id = "VOX-" + Math.floor(Math.random() * 900000 + 100000);
                localStorage.setItem('vox_id', id);
            }
            return id;
        }

        // ===== ПРОВЕРКА НА ВЛАДЕЛЬЦА =====
        function checkOwner() {
            userName = document.getElementById('nameInput').value.trim() || "Гость";
            
            userID = getSavedID();
            document.getElementById('myIDValue').innerText = userID;
            
            if (userName === "Владелец") {
                isAdmin = true;
                isPrime = true;
                coins = 999999;
                userAvatar = "👑";
                userRank = "👑 Владелец";
                document.getElementById('nameInput').disabled = true;
                document.getElementById('adminBtn').style.display = "block";
                document.getElementById('coinCount').innerText = coins;
                document.getElementById('avatarBtn').innerText = "👑";
            } else {
                isAdmin = false;
                isPrime = false;
                coins = 0;
                userAvatar = "🐱";
                userRank = "🩷 VOX";
                document.getElementById('adminBtn').style.display = "none";
                document.getElementById('coinCount').innerText = coins;
            }
        }

        // ===== ДЕЙСТВИЯ НАД СООБЩЕНИЕМ =====
        function showActionPanel(name, id) {
            selectedUserName = name;
            selectedUserID = id;
            document.getElementById('actionTargetName').innerText = name;
            document.getElementById('actionTargetID').innerText = id;
            document.getElementById('actionPanel').style.display = 'block';
        }

        function closeActionPanel() {
            document.getElementById('actionPanel').style.display = 'none';
        }

        function actionBan() {
            db.ref('admin/actions').push({ type: 'ban', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователь " + selectedUserName + " (ID: " + selectedUserID + ") забанен!");
            closeActionPanel();
        }

        function actionWarn() {
            db.ref('admin/actions').push({ type: 'warn', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователю " + selectedUserName + " (ID: " + selectedUserID + ") выдано предупреждение!");
            closeActionPanel();
        }

        function actionMute() {
            db.ref('admin/actions').push({ type: 'mute', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователь " + selectedUserName + " (ID: " + selectedUserID + ") замучен!");
            closeActionPanel();
        }

        function actionGiveAdmin() {
            db.ref('admin/actions').push({ type: 'admin', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователь " + selectedUserName + " (ID: " + selectedUserID + ") назначен админом!");
            closeActionPanel();
        }

        function actionGivePrime() {
            db.ref('admin/actions').push({ type: 'prime', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователю " + selectedUserName + " (ID: " + selectedUserID + ") выдан Prime!");
            closeActionPanel();
        }

        function actionGiveCoins() {
            const amount = prompt("Сколько коинов выдать?");
            if (!amount) return;
            db.ref('admin/actions').push({ type: 'coins', target: selectedUserName, id: selectedUserID, value: parseInt(amount), time: Date.now() });
            alert("Пользователю " + selectedUserName + " (ID: " + selectedUserID + ") выдано " + amount + " коинов!");
            closeActionPanel();
        }

        function actionGiveGift() {
            db.ref('admin/actions').push({ type: 'gift', target: selectedUserName, id: selectedUserID, time: Date.now() });
            alert("Пользователю " + selectedUserName + " (ID: " + selectedUserID + ") выдан подарок!");
            closeActionPanel();
        }

        // ===== РЕАКЦИИ =====
        function showReactionPanel(key) {
            selectedMessageKey = key;
            document.getElementById('reactionPanel').style.display = 'block';
        }

        function closeReactionPanel() {
            document.getElementById('reactionPanel').style.display = 'none';
            selectedMessageKey = null;
        }

        function addReaction(emoji) {
            if (!selectedMessageKey || !currentRef) return;
            currentRef.child(selectedMessageKey + '/reaction').set(emoji);
            closeReactionPanel();
        }

        // ===== ВОЗВРАТ К СПИСКУ ЧАТОВ =====
        function backToChats() {
            document.body.classList.remove('show-chat');
        }

        // ===== АДМИН =====
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function adminGiveRank() {
            const targetID = document.getElementById('adminTarget').value;
            if (!targetID) return;
            db.ref('admin/actions').push({ type: 'rank', target: targetID, value: '👑 VOX Легенда', time: Date.now() });
            alert("Пользователю с ID " + targetID + " выдано звание Легенда!");
        }

        function adminGiveCoins() {
            const targetID = document.getElementById('adminTarget').value;
            if (!targetID) return;
            const amount = prompt("Сколько коинов выдать?");
            if (!amount) return;
            db.ref('admin/actions').push({ type: 'coins', target: targetID, value: parseInt(amount), time: Date.now() });
            alert("Пользователю с ID " + targetID + " выдано " + amount + " коинов!");
        }

        function adminWarn() {
            const targetID = document.getElementById('adminTarget').value;
            if (!targetID) return;
            db.ref('admin/actions').push({ type: 'warn', target: targetID, time: Date.now() });
            alert("Пользователю с ID " + targetID + " выдано предупреждение!");
        }

        function adminBan() {
            const targetID = document.getElementById('adminTarget').value;
            if (!targetID) return;
            db.ref('admin/actions').push({ type: 'ban', target: targetID, time: Date.now() });
            alert("Пользователь с ID " + targetID + " забанен!");
        }

        // ===== ОСТАЛЬНОЕ =====
        function toggleAvatarPanel() {
            const panel = document.getElementById('avatarPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function toggleEmojiPanel() {
            const panel = document.getElementById('emojiPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function togglePremiumPanel() {
            const panel = document.getElementById('premiumPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function toggleGiftPanel() {
            const panel = document.getElementById('giftPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function setAvatar(emoji) {
            userAvatar = emoji;
            document.getElementById('avatarBtn').innerText = emoji;
            document.getElementById('avatarPanel').style.display = 'none';
        }

        function setRank(rank) {
            if (!isPrime && rank !== '🩷 VOX') {
                alert("Сначала получи VOX Prime — напиши @V0XPRM");
                return;
            }
            userRank = rank;
            document.getElementById('premiumPanel').style.display = 'none';
            alert("Ты получил звание: " + rank);
        }

        function buyPrime() {
            alert("Чтобы получить VOX Prime, напиши в Telegram: @V0XPRM");
            window.open("https://t.me/V0XPRM", "_blank");
        }

        function buyCoins() {
            alert("Чтобы купить коины (15 коинов = 30 рублей), напиши в Telegram: @V0XPRM");
            window.open("https://t.me/V0XPRM", "_blank");
        }

        function addEmoji(emoji) {
            const msgInput = document.getElementById('msgInput');
            msgInput.value += emoji;
            document.getElementById('emojiPanel').style.display = 'none';
        }

        function sendGift(emoji, price) {
            if (coins < price) {
                alert("Недостаточно коинов! Нужно " + price + ", у тебя " + coins);
                return;
            }
            coins -= price;
            document.getElementById('coinCount').innerText = coins;
            
            if (!db || !currentRef) return;
            currentRef.push({
                name: userName,
                avatar: userAvatar,
                rank: userRank,
                id: userID,
                text: emoji + ' ПОДАРОК! ' + emoji,
                time: Date.now(),
                gift: true
            });
            document.getElementById('giftPanel').style.display = 'none';
        }

        function openChat(chatId, chatName) {
            currentChat = chatId;
            document.getElementById('chatTitle').innerText = chatName;
            document.getElementById('chat').innerHTML = '';
            
            if (currentRef) currentRef.off();
            currentRef = db.ref('chats/' + chatId);
            
            currentRef.child('users/' + userName).set(true);
            currentRef.child('users/' + userName).onDisconnect().remove();

            currentRef.child('users').on('value', (snap) => {
                const users = [];
                snap.forEach((child) => users.push(child.key));
                document.getElementById('onlineList').innerText = 'Онлайн: ' + (users.length ? users.join(', ') : 'никого');
            });

            currentRef.once('value', (snap) => {
                document.getElementById('chat').innerHTML = '';
                snap.forEach((child) => {
                    if (child.key !== 'users') {
                        addMessageToChat(child.val(), child.key);
                    }
                });
            });

            loadMessages();
            document.body.classList.add('show-chat');
        }

        function sendMessage() {
            if (!db || !currentRef) return;
            const msgInput = document.getElementById('msgInput');
            const text = msgInput.value.trim();
            if (!text) return;

            currentRef.child('users/' + userName).set(true);
            currentRef.push({
                name: userName,
                avatar: userAvatar,
                rank: userRank,
                id: userID,
                text: text,
                time: Date.now()
            });
            msgInput.value = '';
        }

        function deleteMessage(key) {
            if (!db || !currentRef) return;
            if (confirm("Удалить сообщение?")) {
                currentRef.child(key).remove();
            }
        }

        function loadMessages() {
            currentRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const key = snapshot.key;
                if (key === 'users') return;
                
                if (msg.name !== userName) {
                    new Audio('https://www.soundjay.com/buttons/beep-07.wav').play();
                }
                addMessageToChat(msg, key);
            });

            currentRef.on('child_removed', (snapshot) => {
                if (snapshot.key === 'users') return;
                document.getElementById('chat').innerHTML = '';
                currentRef.once('value', (snap) => {
                    snap.forEach((child) => {
                        if (child.key !== 'users') {
                            addMessageToChat(child.val(), child.key);
                        }
                    });
                });
            });
        }

        function addMessageToChat(msg, key) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.name === userName ? 'my' : 'other');
            if (msg.gift) div.style.background = '#ffd700';
            
            if (isAdmin && msg.name !== userName) {
                let pressTimer;
                div.addEventListener('mousedown', () => {
                    pressTimer = setTimeout(() => showActionPanel(msg.name, msg.id), 500);
                });
                div.addEventListener('mouseup', () => clearTimeout(pressTimer));
                div.addEventListener('mouseleave', () => clearTimeout(pressTimer));
                div.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => showActionPanel(msg.name, msg.id), 500);
                });
                div.addEventListener('touchend', () => clearTimeout(pressTimer));
            }
            
            let pressTimer2;
            div.addEventListener('mousedown', () => {
                pressTimer2 = setTimeout(() => showReactionPanel(key), 800);
            });
            div.addEventListener('mouseup', () => clearTimeout(pressTimer2));
            div.addEventListener('mouseleave', () => clearTimeout(pressTimer2));
            div.addEventListener('touchstart', () => {
                pressTimer2 = setTimeout(() => showReactionPanel(key), 800);
            });
            div.addEventListener('touchend', () => clearTimeout(pressTimer2));
            
            const avatarSpan = document.createElement('span');
            avatarSpan.className = 'msg-avatar';
            avatarSpan.innerText = msg.avatar || '🐱';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="name">' + msg.name + ' <span class="rank">' + (msg.rank || '') + '</span> <span class="id">' + (msg.id || '') + '</span></div>' + msg.text;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '✖';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteMessage(key); };
            
            if (isAdmin || msg.name === userName) {
                delBtn.style.display = 'block';
            }
            
            div.appendChild(avatarSpan);
            div.appendChild(bubble);
            div.appendChild(delBtn);
            
            if (msg.reaction) {
                const reactionSpan = document.createElement('span');
                reactionSpan.className = 'reaction';
                reactionSpan.innerText = msg.reaction;
                div.appendChild(reactionSpan);
            }
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addFriend() {
            const friendName = prompt("Введи имя друга:");
            if (!friendName) return;
            
            const container = document.getElementById('chats');
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = '<span class="avatar">👤</span><span class="name">' + friendName + '</span>';
            div.onclick = () => openChat('friend_' + friendName, friendName);
            container.appendChild(div);
        }

        function loadChats() {
            const chats = [
                { id: 'general', name: 'Общий чат', avatar: '🌍' },
                { id: 'support', name: 'Поддержка', avatar: '🆘' },
                { id: 'chat1', name: 'Чат 1', avatar: '💬' },
                { id: 'chat2', name: 'Чат 2', avatar: '💬' }
            ];
            
            const container = document.getElementById('chats');
            container.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.id === currentChat ? ' active' : '');
                div.innerHTML = '<span class="avatar">' + chat.avatar + '</span><span class="name">' + chat.name + '</span>';
                div.onclick = () => openChat(chat.id, chat.name);
                container.appendChild(div);
            });
        }

        window.onload = function() {
            if (db) {
                checkOwner();
                loadChats();
                openChat('general', 'Общий чат');
            }
        };
    </script>
</body>
</html>
